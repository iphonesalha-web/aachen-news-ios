name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project AachenNews.xcodeproj -target AachenNews \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | grep -E "error:|BUILD (SUCCEEDED|FAILED)|\*\*" || true
          test -d build/Release-iphoneos/AachenNews.app
          test -f build/Release-iphoneos/AachenNews.app/web/index.html

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/AachenNews.app Payload/
          zip -qry AachenNews.ipa Payload
          ls -lh AachenNews.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" AachenNews.ipa \
            --title "أخبار آخن v1.0.${{ github.run_number }}" \
            --notes "ملف IPA غير موقّع — وقّعه بشهادتك في ESign ثم ثبّته." \
            --latest
